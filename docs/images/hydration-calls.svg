<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title description">
  <title id="title">Initial identity hydration calls</title>
  <desc id="description">A stacked horizontal bar chart shows four calls for reference identities, six calls with one season, eight calls with two seasons, and eleven calls with two seasons plus vocabularies.</desc>
  <defs>
    <style>
      .background { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .reference { fill: #0284c7; }
      .season { fill: #16a34a; }
      .vocabulary { fill: #7c3aed; }
      .title { fill: #0f172a; font: 700 25px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #0f172a; font: 600 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #334155; font: 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .axis { stroke: #64748b; stroke-width: 1.5; }
      .grid { stroke: #cbd5e1; stroke-width: 1; }
      @media (prefers-color-scheme: dark) {
        .background { fill: #0f172a; }
        .frame { fill: #1e293b; stroke: #64748b; }
        .reference { fill: #38bdf8; }
        .season { fill: #4ade80; }
        .vocabulary { fill: #a78bfa; }
        .title, .label { fill: #f8fafc; }
        .body { fill: #e2e8f0; }
        .axis { stroke: #cbd5e1; }
        .grid { stroke: #475569; }
      }
    </style>
  </defs>
  <rect class="background" width="1100" height="560"/>
  <text class="title" x="550" y="42" text-anchor="middle">Initial calls on an empty identity cache</text>
  <text class="body" x="550" y="70" text-anchor="middle">A dry run subtracts any partitions that are already fresh</text>
  <rect class="frame" x="250" y="100" width="780" height="350"/>

  <line class="grid" x1="250" y1="100" x2="250" y2="450"/>
  <line class="grid" x1="380" y1="100" x2="380" y2="450"/>
  <line class="grid" x1="510" y1="100" x2="510" y2="450"/>
  <line class="grid" x1="640" y1="100" x2="640" y2="450"/>
  <line class="grid" x1="770" y1="100" x2="770" y2="450"/>
  <line class="grid" x1="900" y1="100" x2="900" y2="450"/>
  <line class="grid" x1="1030" y1="100" x2="1030" y2="450"/>

  <text class="label" x="230" y="157" text-anchor="end">References only</text>
  <rect class="reference" x="250" y="125" width="260" height="48"/>
  <text class="label" x="520" y="157">4</text>

  <text class="label" x="230" y="237" text-anchor="end">+ one season</text>
  <rect class="reference" x="250" y="205" width="260" height="48"/>
  <rect class="season" x="510" y="205" width="130" height="48"/>
  <text class="label" x="650" y="237">6</text>

  <text class="label" x="230" y="317" text-anchor="end">+ two seasons</text>
  <rect class="reference" x="250" y="285" width="260" height="48"/>
  <rect class="season" x="510" y="285" width="260" height="48"/>
  <text class="label" x="780" y="317">8</text>

  <text class="label" x="230" y="397" text-anchor="end">+ vocabularies</text>
  <rect class="reference" x="250" y="365" width="260" height="48"/>
  <rect class="season" x="510" y="365" width="260" height="48"/>
  <rect class="vocabulary" x="770" y="365" width="195" height="48"/>
  <text class="label" x="975" y="397">11</text>

  <line class="axis" x1="250" y1="450" x2="1030" y2="450"/>
  <text class="body" x="250" y="478" text-anchor="middle">0</text>
  <text class="body" x="380" y="478" text-anchor="middle">2</text>
  <text class="body" x="510" y="478" text-anchor="middle">4</text>
  <text class="body" x="640" y="478" text-anchor="middle">6</text>
  <text class="body" x="770" y="478" text-anchor="middle">8</text>
  <text class="body" x="900" y="478" text-anchor="middle">10</text>
  <text class="body" x="1030" y="478" text-anchor="middle">12 calls</text>

  <rect class="reference" x="300" y="515" width="18" height="18"/>
  <text class="body" x="328" y="529">4 reference calls</text>
  <rect class="season" x="515" y="515" width="18" height="18"/>
  <text class="body" x="543" y="529">2 per season</text>
  <rect class="vocabulary" x="705" y="515" width="18" height="18"/>
  <text class="body" x="733" y="529">3 optional vocabulary calls</text>
</svg>
