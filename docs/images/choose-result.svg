<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title description">
  <title id="title">Choose the smallest useful cfb-data result</title>
  <desc id="description">A decision diagram maps four needs to four result types: a scalar ID or name, a compact identity model, a DataFrame for analysis, or a nested Pydantic model.</desc>
  <defs>
    <style>
      .background { fill: #f8fafc; }
      .question { fill: #ffffff; stroke: #475569; stroke-width: 2; }
      .scalar { fill: #e0f2fe; stroke: #0369a1; stroke-width: 2; }
      .identity { fill: #ede9fe; stroke: #6d28d9; stroke-width: 2; }
      .frame { fill: #dcfce7; stroke: #15803d; stroke-width: 2; }
      .model { fill: #ffedd5; stroke: #c2410c; stroke-width: 2; }
      .title { fill: #0f172a; font: 700 25px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .label { fill: #0f172a; font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .body { fill: #334155; font: 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .code { fill: #0f172a; font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .arrow { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrowhead); }
      @media (prefers-color-scheme: dark) {
        .background { fill: #0f172a; }
        .question { fill: #1e293b; stroke: #94a3b8; }
        .scalar { fill: #0c4a6e; stroke: #38bdf8; }
        .identity { fill: #4c1d95; stroke: #c4b5fd; }
        .frame { fill: #14532d; stroke: #86efac; }
        .model { fill: #7c2d12; stroke: #fdba74; }
        .title, .label, .code { fill: #f8fafc; }
        .body { fill: #e2e8f0; }
        .arrow { stroke: #cbd5e1; }
      }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect class="background" width="1200" height="560"/>
  <text class="title" x="600" y="40" text-anchor="middle">Choose the smallest result that answers the next question</text>
  <rect class="question" x="390" y="70" width="420" height="80" rx="8"/>
  <text class="label" x="600" y="105" text-anchor="middle">What does the next notebook cell need?</text>
  <text class="body" x="600" y="132" text-anchor="middle">A key, identity, analytical rows, or nested structure?</text>

  <path class="arrow" d="M470 150 L155 245"/>
  <path class="arrow" d="M555 150 L445 245"/>
  <path class="arrow" d="M645 150 L755 245"/>
  <path class="arrow" d="M730 150 L1045 245"/>

  <text class="body" x="155" y="220" text-anchor="middle">Only an ID or name</text>
  <rect class="scalar" x="20" y="250" width="270" height="240" rx="8"/>
  <text class="label" x="155" y="288" text-anchor="middle">Python scalar</text>
  <text class="body" x="155" y="322" text-anchor="middle">Team ID or canonical name</text>
  <text class="code" x="155" y="365" text-anchor="middle">resolve_id(...)</text>
  <text class="code" x="155" y="395" text-anchor="middle">resolve_name(...)</text>
  <text class="body" x="155" y="450" text-anchor="middle">Example: 130</text>

  <text class="body" x="445" y="220" text-anchor="middle">A few stable fields</text>
  <rect class="identity" x="310" y="250" width="270" height="240" rx="8"/>
  <text class="label" x="445" y="288" text-anchor="middle">Compact identity</text>
  <text class="body" x="445" y="322" text-anchor="middle">ID plus useful relationships</text>
  <text class="code" x="445" y="365" text-anchor="middle">identities.*.resolve(...)</text>
  <text class="code" x="445" y="395" text-anchor="middle">identities.games.find(...)</text>
  <text class="body" x="445" y="450" text-anchor="middle">No DataFrame construction</text>

  <text class="body" x="755" y="220" text-anchor="middle">Rows for analysis</text>
  <rect class="frame" x="620" y="250" width="270" height="240" rx="8"/>
  <text class="label" x="755" y="288" text-anchor="middle">DataFrame</text>
  <text class="body" x="755" y="322" text-anchor="middle">Full endpoint columns</text>
  <text class="code" x="755" y="365" text-anchor="middle">games.list(...)</text>
  <text class="code" x="755" y="395" text-anchor="middle">stats.team_season(...)</text>
  <text class="body" x="755" y="450" text-anchor="middle">pandas or Polars</text>

  <text class="body" x="1045" y="220" text-anchor="middle">Several natural row shapes</text>
  <rect class="model" x="910" y="250" width="270" height="240" rx="8"/>
  <text class="label" x="1045" y="288" text-anchor="middle">Nested model</text>
  <text class="body" x="1045" y="322" text-anchor="middle">Structure stays together</text>
  <text class="code" x="1045" y="365" text-anchor="middle">plays.live(...)</text>
  <text class="code" x="1045" y="395" text-anchor="middle">playoffs.cfp(...)</text>
  <text class="body" x="1045" y="450" text-anchor="middle">Attributes or model_dump()</text>
</svg>
