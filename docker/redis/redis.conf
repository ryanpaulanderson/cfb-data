# Durable local configuration for the non-expiring identity catalog.
bind 0.0.0.0
protected-mode no
port 6379

appendonly yes
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 32mb
save 60 1000
dir /data

# Bound the local dataset. Only response and lease keys expire, so the shortest
# remaining response TTL is evicted first while catalog facts remain coherent.
maxmemory 4gb
maxmemory-policy volatile-ttl

loglevel notice
