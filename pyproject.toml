[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-data"
version = "0.1.0"
description = "An experimental async toolkit for validated CollegeFootballData API access"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ryan Anderson" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiohttp>=3.13,<4",
    "pandas>=3.0,<4",
    "pandera>=0.29,<1",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "black>=26.1,<27",
    "interrogate>=1.7,<2",
    "isort>=6.1,<7",
    "pre-commit>=4.5,<5",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
]

[project.urls]
Repository = "https://github.com/ryanpaulanderson/cfb-data"
Issues = "https://github.com/ryanpaulanderson/cfb-data/issues"

[tool.setuptools]
package-dir = { "" = "cfb_data" }

[tool.setuptools.packages.find]
where = ["cfb_data"]
include = ["cfb_data*"]
namespaces = false

[tool.black]
line-length = 88
target-version = ["py311", "py312", "py313"]

[tool.isort]
profile = "black"
known_first_party = ["cfb_data"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["cfb_data/cfb_data/tests"]

[tool.interrogate]
fail-under = 100
verbose = 1
