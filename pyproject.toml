[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-data"
version = "0.5.0"
description = "Async validated CollegeFootballData access for pandas and Polars"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ryan Anderson" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiohttp>=3.13,<4",
    "aiosqlite>=0.22,<1",
    "pandas>=3.0,<4",
    "pydantic>=2.12,<3",
    "pyarrow>=25,<26",
]

[project.optional-dependencies]
polars = [
    "polars>=1.43.2,<2",
]
redis = [
    "redis>=7.1,<8",
]
dev = [
    "build>=1.5,<2",
    "furo>=2025.12.19",
    "mypy>=2.3,<3",
    "myst-parser>=5.1,<6",
    "pre-commit>=4.5,<5",
    "pyarrow-stubs>=20.0.0.20260625,<21",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.15.22,<0.17",
    "sphinx>=9.1,<10",
    "twine>=7,<8",
]

[project.urls]
Documentation = "https://ryanpaulanderson.github.io/cfb-data/"
Repository = "https://github.com/ryanpaulanderson/cfb-data"
Issues = "https://github.com/ryanpaulanderson/cfb-data/issues"

[tool.setuptools]
package-dir = { "" = "cfb_data" }

[tool.setuptools.packages.find]
where = ["cfb_data"]
include = ["cfb_data*"]
namespaces = false

[tool.setuptools.package-data]
cfb_data = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "B",
    "D",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "D105", # Magic methods inherit their contracts from Python.
    "D107", # Class docstrings document initialization semantics.
]

[tool.ruff.lint.per-file-ignores]
"cfb_data/cfb_data/tests/**/*.py" = [
    "D",      # Production docstrings remain the published contract.
    "SIM117", # Nested context ownership is explicit in lifecycle tests.
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["cfb_data/cfb_data"]
exclude = ["^cfb_data/cfb_data/tests/"]
pretty = true
show_error_codes = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["cfb_data/cfb_data/tests"]
markers = [
    "redis: requires an explicitly configured disposable Redis integration service",
    "live_api: requires CFBD_API_KEY and makes bounded calls to the real API",
]
