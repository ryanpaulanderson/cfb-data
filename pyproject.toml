[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cfb-data"
version = "0.1.0"
description = "An experimental async toolkit for validated CollegeFootballData API access"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ryan Anderson" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "aiohttp>=3.13,<4",
    "pandas>=3.0,<4",
    "pandera>=0.29,<1",
    "pydantic>=2.12,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3,<3",
    "pre-commit>=4.5,<5",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.15.22,<0.16",
]

[project.urls]
Repository = "https://github.com/ryanpaulanderson/cfb-data"
Issues = "https://github.com/ryanpaulanderson/cfb-data/issues"

[tool.setuptools]
package-dir = { "" = "cfb_data" }

[tool.setuptools.packages.find]
where = ["cfb_data"]
include = ["cfb_data*"]
namespaces = false

[tool.setuptools.package-data]
cfb_data = ["py.typed"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",
    "D",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "SIM",
    "UP",
    "W",
]
ignore = [
    "D105", # Magic methods inherit their contracts from Python.
    "D107", # Class docstrings document initialization semantics.
]

[tool.ruff.lint.per-file-ignores]
"cfb_data/cfb_data/base/api/base_api.py" = [
    "B010", # Route decorators attach metadata to arbitrary callables.
]
"cfb_data/cfb_data/tests/**/*.py" = [
    "B",    # Preserve legacy boundary-test scaffolding in this focused change.
    "D",    # Production docstrings remain the published contract.
    "E402", # Some tests install import stubs before importing the package.
    "F841", # Legacy integration tests retain results for narrative clarity.
    "SIM",  # Preserve explicit failure-flow setup in legacy tests.
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["cfb_data/cfb_data"]
exclude = ["^cfb_data/cfb_data/tests/"]
pretty = true
show_error_codes = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["cfb_data/cfb_data/tests"]
