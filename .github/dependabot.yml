version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
      time: "01:00"
      timezone: "America/New_York"
    # Preserve this library's existing lower bounds while widening supported
    # ranges when a deliberately reviewed update requires it.
    versioning-strategy: "widen"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
      include: "scope"
    groups:
      patch-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"

  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:30"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      patch-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-updates:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "01:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
