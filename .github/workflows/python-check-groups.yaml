name: Python quality groups

on:
  workflow_call:
    inputs:
      python-version:
        description: Supported Python version for all groups in this invocation
        required: true
        type: string

permissions:
  contents: read

jobs:
  group:
    name: test group ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: make install

      - name: Run shared quality contract
        env:
          PYTEST_ADDOPTS: --splits 3 --group ${{ matrix.group }} --splitting-algorithm least_duration
        run: make check
