name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installation:
    name: Python ${{ matrix.python-version }} / ${{ matrix.installation }} install
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
        installation: ["base", "polars", "redis", "yaml", "dask", "all"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install base package
        if: matrix.installation == 'base'
        run: python -m pip install .

      - name: Install package with Polars
        if: matrix.installation == 'polars'
        run: python -m pip install ".[polars]"

      - name: Install package with Redis
        if: matrix.installation == 'redis'
        run: python -m pip install ".[redis]"

      - name: Install package with YAML
        if: matrix.installation == 'yaml'
        run: python -m pip install ".[yaml]"

      - name: Install package with Dask
        if: matrix.installation == 'dask'
        run: python -m pip install ".[dask]"

      - name: Install package with every optional feature
        if: matrix.installation == 'all'
        run: python -m pip install ".[polars,redis,yaml,dask]"

      - name: Verify installed-user imports
        env:
          INSTALLATION: ${{ matrix.installation }}
        run: |
          python - <<'PY'
          import asyncio
          import importlib.util
          import os
          from importlib.metadata import entry_points

          from aiohttp import web
          import pandas
          import pyarrow
          from cfb_data import CFBDClient, RetryPolicy

          assert pyarrow.__version__
          expected = os.environ["INSTALLATION"]
          optional_modules = {
              "polars": "polars",
              "redis": "redis",
              "yaml": "yaml",
              "dask": "distributed",
          }
          present_modules = {
              option: importlib.util.find_spec(module) is not None
              for option, module in optional_modules.items()
          }
          # Native dataframe execution is core; Dask also requires PyYAML.
          assert importlib.util.find_spec("dask.dataframe") is not None
          assert present_modules["yaml"]
          if expected == "base":
              assert not any(found for option, found in present_modules.items() if option != "yaml")
          elif expected == "all":
              assert all(present_modules.values())
          else:
              assert present_modules[expected]
          has_polars = present_modules["polars"]
          providers = entry_points(group="cfb_data.recipes")
          assert any(
              item.name == "official" and item.value == "cfb_data_recipes"
              for item in providers
          )

          async def main() -> None:
              async def calendar(request: web.Request) -> web.Response:
                  assert request.query == {"year": "2024"}
                  return web.json_response([])

              app = web.Application()
              app.router.add_get("/calendar", calendar)
              runner = web.AppRunner(app)
              await runner.setup()
              site = web.TCPSite(runner, "127.0.0.1", 0)
              await site.start()
              assert site._server is not None
              port = site._server.sockets[0].getsockname()[1]
              backend = "polars" if has_polars else "pandas"
              try:
                  async with CFBDClient(
                      "installation-smoke-test",
                      dataframe_backend=backend,
                      base_url=f"http://127.0.0.1:{port}",
                      retry_policy=RetryPolicy(max_attempts=1),
                  ) as client:
                      frame = await client.games.calendar(year=2024)
                  assert len(frame) == 0
                  if has_polars:
                      import polars
                      assert isinstance(frame, polars.DataFrame)
                  else:
                      assert isinstance(frame, pandas.DataFrame)
              finally:
                  await runner.cleanup()

          asyncio.run(main())
          PY

  check-groups-312:
    name: Python 3.12
    uses: ./.github/workflows/python-check-groups.yaml
    with:
      python-version: "3.12"

  check-groups-313:
    name: Python 3.13
    uses: ./.github/workflows/python-check-groups.yaml
    with:
      python-version: "3.13"

  check:
    name: Python ${{ matrix.python-version }}
    needs: [check-groups-312, check-groups-313]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            group_job: check-groups-312
          - python-version: "3.13"
            group_job: check-groups-313
    steps:
      - name: Require this Python version's test groups
        env:
          GROUP_RESULT: ${{ needs[matrix.group_job].result }}
        run: test "$GROUP_RESULT" = success
